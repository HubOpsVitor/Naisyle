<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seleção de Personagens - RPG</title>

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="rotate-warning">
        <div class="rotate-icon">&#8635;</div>
        <p>VIRE O CELULAR NA HORIZONTAL PARA JOGAR</p>
    </div>

    <div class="selection-screen">

        <div class="logo-container">
            <img src="Logo.png" alt="Logo do Jogo" id="logo-img">
        </div>

        <div class="spotify-box" id="spotify-container">

        </div>

        <button class="nav-arrow arrow-left" id="btn-prev" onclick="prevCharacter()">&#10094;</button>
        <button class="nav-arrow arrow-right" id="btn-next" onclick="nextCharacter()">&#10095;</button>

        <h1 id="char-name" class="character-name">Letícia</h1>

        <div class="attributes-grid" id="attributes-container">

        </div>

        <div class="center-panel">
            <p id="char-bio" class="story-text">
                (Aqui vai ser uma sinopse do perso)
            </p>
        </div>

        <div class="right-panel">

            <img id="ghost-img" class="bg-ghost-character" src="" alt="Fantasma do Personagem">

            <img id="main-img" class="main-character-img" src="" alt="Personagem Principal">
        </div>

        <button class="select-btn" id="btn-select" onclick="openSelectModal()">[ SELECIONAR ]</button>
    </div>

    <div class="modal-overlay" id="modal-overlay">
        <div class="modal-content">
            <h2 id="modal-title">COLOQUE O CÓDIGO PARA PROSSEGUIR:</h2>
            
            <div id="password-section">
                <input type="password" id="password-input" maxlength="4" placeholder="••••" autocomplete="off">
                <div class="modal-buttons">
                    <button class="modal-btn-confirm" onclick="verifyPassword()">CONFIRMAR</button>
                    <button class="modal-btn-cancel" onclick="closeSelectModal()">VOLTAR</button>
                </div>
                <p id="password-error" class="error-msg"></p>
            </div>

            <div id="inventory-section" class="hidden">
                <h3 class="success-msg">Personagem liberado!</h3>
                <p class="inventory-subtitle">Você tem esses itens:</p>
                
                <div id="items-list" class="items-container">

                </div>

                <button class="modal-btn-confirm" onclick="downloadCharacterSheet()">Clique aqui para baixar a ficha</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
